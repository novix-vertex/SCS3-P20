<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUBO - Digital Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="shortcut icon" href="assets/images/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <section class="section section1 progress"></section>
        <section class="section section2 views">
            <div class="left-content">
                <h2>4.875</h2>
                <h4>Project Views<br>last year</h4>
                <div class="bottom-content">
                    <button class="content">
                        <img src="assets/images/growth-ic.png" alt="Growth Icon">
                        +15%
                    </button>
                    <h5>vs last year</h5>
                </div>
            </div>
            <div class="right-content">
                <img class="heart" src="assets/images/heart.png" alt="heart">
            </div>

        </section>
        <section class="section section3 users">
            <div class="left-content">
                <h4>New Users</h4>
                <h2>57K</h2>
                <h3>+10%<i class="ri-arrow-right-up-line"></i></h3>
                <h5>vs last month</h5>
            </div>
            <div class="right-content">
                <i class="ri-group-line"></i>
            </div>
        </section>
        <section class="section section4 team"></section>
        <section class="section section5 dashboard"></section>
        <section class="section section6 girls"></section>
        <section class="section section7 fonts">
            <div class="top">
                <div class="content">
                    <h3>Font</h3>
                    <h5>Sk - Modernist</h5>
                </div>
                <div class="font-visual">A<sub>a</sub></div>
            </div>
            <div class="center">
                <div class="color-pallette"></div>
                <div class="color-pallette"></div>
                <div class="color-pallette"></div>
                <div class="color-pallette"></div>
            </div>
            <div class="bottom">
                <h5>View all fonts</h5>
                <i class="ri-arrow-right-s-line"></i>
            </div>
        </section>
        <section class="section section8 explore">
            <div class="content">
                <h3>We Build Future of<br />Design Industry</h3>
                <h5>Crafting Meaningful UX/UI Design</h5>
                <button class="explore-btn">Explore more<i class="ri-arrow-right-s-line"></i></button>
            </div>
            <img src="assets/images/model-3d.png" alt="3d model">
        </section>
        <section class="section section9 logo">
            <img src="assets/images/logo.png" alt="Cubo Logo">
            <h1>Cubo</h1>
            <h5>Digital Studio</h5>
            <button class="discover-btn">Discover more<i class="ri-arrow-right-s-line"></i></button>
        </section>
    </main>
</body>

</html>
